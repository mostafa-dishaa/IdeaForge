<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaForge | Login</title>
    <link rel="stylesheet" href="../files_css/registration.css">
    <!--icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="auth-background">
    
        <div class="overlay"></div>
    
        <div class="auth-card-container">
    
            <!-- Login Card -->
            <div class="form-container">
    
                <p class="title">Welcome back</p>
    
                <form class="form">
    
                    <input type="email" class="input" placeholder="Email" required>
    
                    <input type="password" class="input" placeholder="Password" required>
    
                    <p class="page-link">
                        <a href="#" class="page-link-label">Forgot Password?</a>
                    </p>
    
                    <button type="submit" class="form-btn">Log in</button>
    
                </form>
    
                <p class="sign-up-label">
                    Don't have an account?
                    <a href="signup.html" class="sign-up-link">Sign up</a>
                </p>
    
                <div class="buttons-container">
    
                    <button type="button" class="apple-login-button">
                        <span class="social-icon"><i class="fa-brands fa-apple" style="color: rgb(255, 255, 255);"></i></span>
                        Log in with Apple
                    </button>
    
                    <button type="button" class="google-login-button">
                        <span class="social-icon google-icon">G</span>
                        Log in with Google
                    </button>
    
                </div>
    
            </div>
    
        </div>
    
    </main>

</body>

</html>
