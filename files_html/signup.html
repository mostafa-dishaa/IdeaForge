<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaForge | signUP</title>
    <link rel="stylesheet" href="../files_css/registration.css">
    <!--icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="auth-background">
        <div class="overlay"></div>
        <div class="auth-card-container">
            <form class="signup-form">
                <p class="signup-title">Create Account</p>
            
                <p class="signup-message">
                    Sign up now and start creating amazing ideas.
                </p>
            
                <div class="signup-flex">
            
                    <label>
                        <input required placeholder=" " type="text" class="signup-input">
                        <span>First Name</span>
                    </label>
            
                    <label>
                        <input required placeholder=" " type="text" class="signup-input">
                        <span>Last Name</span>
                    </label>
            
                </div>
            
                <label>
                    <input required placeholder=" " type="email" class="signup-input">
                    <span>Email Address</span>
                </label>
            
                <label>
                    <input required placeholder=" " type="password" class="signup-input">
                    <span>Password</span>
                </label>
            
                <label>
                    <input required placeholder=" " type="password" class="signup-input">
                    <span>Confirm Password</span>
                </label>
            
                <button type="submit" class="signup-submit">
                    Create Account
                </button>
            
                <p class="signup-signin">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            
            </form>
        </div>
    </main>
</body>

</html>
